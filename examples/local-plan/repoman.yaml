# Example configuration for demos — DO NOT PUT REAL TOKENS HERE.
# Use: repoman local plan --config examples/local-plan/repoman.yaml
version: 1

paths:
  # Ephemeral dirs so example runs cannot touch your normal workspace.
  workspace_root: "/tmp/repoman-example-workspace"
  cache_root: "/tmp/repoman-example-cache"

layout: "{remote}/{namespace}/{repo}"

remotes:
  # Placeholder forge entries; discovery stays disabled until namespaces are filled in.
  example_gitlab:
    kind: gitlab
    base_url: "https://gitlab.example.invalid"
    token_env: "REPOMAN_GITLAB_TOKEN"
    clone_protocol: ssh
  example_github:
    kind: github
    base_url: "https://api.github.com"
    token_env: "REPOMAN_GITHUB_TOKEN"
    clone_protocol: ssh

# Keeping this empty skips all remote listing (safe dry preview for structure checks).
namespaces: []

repos: []

mirrors: []

# To try discovery after you duplicate this file elsewhere:
#
# namespaces:
#   - remote: example_github
#     name: "<your_github_org_or_username>"
#     include_subgroups: false
