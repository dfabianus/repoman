[project]
name = "repoman"
version = "0.1.0"
description = "Declarative multi-forge Git workspace sync and mirror management"
authors = [
    { name = "Fabian Müller", email = "fabianmueller100295@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.3",
    "httpx>=0.28.1",
    "pygithub>=2.9.1",
    "python-gitlab>=8.3.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
repoman = "repoman.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-httpx>=0.36.2",
    "ruff>=0.15.12",
]
