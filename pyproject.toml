[project]
name = "repoman-cli"
version = "0.4.1"
description = "Declarative multi-forge Git workspace sync and mirror management"
authors = [
    { name = "Fabian Müller", email = "fabianmueller100295@gmail.com" }
]
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = [
    "click>=8.3.3",
    "httpx>=0.28.1",
    "pygithub>=2.9.1",
    "python-gitlab>=8.3.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
repoman = "repoman.cli:main"

[project.urls]
Homepage = "https://github.com/dfabianus/repoman"
Documentation = "https://dfabianus.github.io/repoman/"
Repository = "https://github.com/dfabianus/repoman"
Issues = "https://github.com/dfabianus/repoman/issues"

# Distribution name is repoman-cli; import package remains `repoman` under src/repoman.
[tool.hatch.build.targets.wheel]
packages = ["src/repoman"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.4",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-httpx>=0.36.2",
    "ruff>=0.15.12",
]
